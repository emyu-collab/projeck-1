<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style/style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Fest 2026</title>
</head>
<body>
  <h1>Tech Fest 2026 </h1>

  <form>
    <label for="name">Name :</label>
    <input type="text" placeholder="nama" id="name">
 <br><br>

    <label for="email">Email :</label>
    <input type="text" placeholder="email" id="email" name="email">
    <br><br>
    
      <label for="kelas">kelas :</label>
      <select name="kelas" id="kelas">
        <option>kelas X</option>
        <option>kelas XI</option>
        <option>kelas XII</option>
      </select>
    <br><br>
  
      <label for="jurusan">Jurusan :</label>
      <select name="jurusan" id="jurusan">
        <option>RPL -Rekayasa perangkat lunak</option>
        <option>TKJ - Teknik komputer dan jaringan</option>
        <option>MM - Multimedia</option>
        <option>TJA - Teknik jaringan akses</option>
      </select>
   
   <br><br>
      <label for="kegiatan">Kegiatan:</label>
      <input type="text" placeholder="kegiatan" id="kegiatan">
    <br>
    
      <input type="checkbox" id="checkbox" name="checkbox"> 
      <label for="checkbox">Saya menyetujui dan ketentuan</label>
    </form><br>
    <button type="submit">Daftar Sekarang</button>
    
   <script src="assets/js/script.js"></script>
</body>
</html>
